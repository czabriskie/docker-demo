# kubectl apply -f deploy/k8s/iris.yaml
# Local try-out with kind:  kind create cluster && kind load docker-image iris-api:latest
# On EKS: change image to your ECR URI and imagePullPolicy to Always.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-api
spec:
  replicas: 3
  selector:
    matchLabels: { app: iris-api }
  template:
    metadata:
      labels: { app: iris-api }
    spec:
      containers:
        - name: iris-api
          image: iris-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: iris-api
spec:
  selector: { app: iris-api }
  ports:
    - port: 80
      targetPort: 8080
  # LoadBalancer gets a public AWS load balancer on EKS; use port-forward locally
  type: ClusterIP
